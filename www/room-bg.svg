<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 860" preserveAspectRatio="xMidYMax meet" role="img" aria-label="SakuraQ room">
<!--
  SakuraQ room scene — authored by hand in SVG, not image-generated.

  Design notes (deliberate choices, not defaults):
  · One light source, upper-left window. Every shadow falls to the lower-right and
    every top-facing surface carries the same warm highlight, so the room reads as
    one space instead of a pile of stickers.
  · Flat-shaded shapes with a single mid-tone + one shadow step. No soft airbrush
    gradients on objects (that is the look image generators produce); gradients are
    reserved for light itself — the window glow and the wall falloff.
  · Straight-on elevation for furniture, floor as a simple horizon band. No fake
    perspective, because a wrong vanishing point is what makes rooms look uncanny.
  · Palette stays inside SakuraQ's lavender: wall #efeafd, floor #e2d8f6,
    furniture #cdbcf0, accents in the app's purple #7c3aed. Deeper values are the
    same hue darkened, never a new hue.
  · Everything sits low in the frame; the upper area is left quiet so the speech
    card and progress panel stay readable on top.
-->
  <defs>
    <!-- daylight pouring in from the window, warm at source, cooling as it spreads -->
    <linearGradient id="rWall" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#f6f2ff"/>
      <stop offset="0.55" stop-color="#efe9fc"/>
      <stop offset="1" stop-color="#e6dcf8"/>
    </linearGradient>
    <linearGradient id="rFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ded2f4"/>
      <stop offset="1" stop-color="#cfc0ec"/>
    </linearGradient>
    <linearGradient id="rGlass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#dff1ff"/>
      <stop offset="1" stop-color="#bcd9f5"/>
    </linearGradient>
    <!-- the shaft of light from the window; the only soft element in the scene -->
    <linearGradient id="rBeam" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fffdf4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fffdf4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rRug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c8f4"/>
      <stop offset="1" stop-color="#c8b2ea"/>
    </linearGradient>
  </defs>

  <!-- ===== shell ===== -->
  <rect width="440" height="860" fill="url(#rWall)"/>
  <!-- floor: horizon at 640, warmer and darker than the wall so depth reads instantly -->
  <rect x="0" y="640" width="440" height="220" fill="url(#rFloor)"/>
  <!-- skirting board catches the light along its top edge -->
  <rect x="0" y="632" width="440" height="12" fill="#c7b6e6"/>
  <rect x="0" y="632" width="440" height="3" fill="#f2ecff" opacity="0.7"/>
  <!-- floorboard seams, spaced unevenly so they don't read as a generated grid -->
  <g stroke="#c2b0e4" stroke-width="1.6" opacity="0.5">
    <path d="M0 686 H440"/><path d="M0 742 H440"/><path d="M0 806 H440"/>
  </g>
  <g stroke="#c2b0e4" stroke-width="1.4" opacity="0.32">
    <path d="M96 644 V686"/><path d="M268 644 V686"/>
    <path d="M38 686 V742"/><path d="M196 686 V742"/><path d="M352 686 V742"/>
    <path d="M132 742 V806"/><path d="M312 742 V806"/>
  </g>

  <!-- ===== window, upper left — the light source ===== -->
  <g>
    <rect x="26" y="150" width="150" height="170" rx="8" fill="#c4b1e8"/>
    <rect x="34" y="158" width="134" height="154" rx="5" fill="url(#rGlass)"/>
    <!-- muntins -->
    <rect x="98" y="158" width="6" height="154" fill="#c4b1e8"/>
    <rect x="34" y="232" width="134" height="6" fill="#c4b1e8"/>
    <!-- sky suggestion: two flat cloud shapes, no gradients -->
    <g fill="#eaf6ff" opacity="0.9">
      <ellipse cx="72" cy="198" rx="26" ry="13"/>
      <ellipse cx="88" cy="192" rx="17" ry="10"/>
      <ellipse cx="136" cy="272" rx="21" ry="11"/>
    </g>
    <!-- sill, lit on top -->
    <rect x="18" y="320" width="166" height="10" rx="3" fill="#bfa9e4"/>
    <rect x="18" y="320" width="166" height="3" fill="#f4eeff" opacity="0.8"/>
  </g>
  <!-- light shaft falling from the window onto the floor -->
  <path d="M34 330 L188 330 L286 700 L120 700 Z" fill="url(#rBeam)"/>

  <!-- ===== shelf, upper right ===== -->
  <g>
    <rect x="262" y="214" width="152" height="9" rx="3" fill="#c0abe6"/>
    <rect x="262" y="214" width="152" height="2.5" fill="#f4eeff" opacity="0.8"/>
    <!-- books: flat blocks, varied widths/heights, one leaning -->
    <rect x="276" y="170" width="15" height="44" fill="#8b6fd6"/>
    <rect x="293" y="178" width="12" height="36" fill="#a98ae4"/>
    <rect x="307" y="164" width="17" height="50" fill="#7c3aed"/>
    <rect x="326" y="182" width="11" height="32" fill="#c0a4f0"/>
    <g transform="rotate(11 344 214)">
      <rect x="339" y="176" width="13" height="38" fill="#9a7ade"/>
    </g>
    <!-- a small pot to break the row of rectangles -->
    <rect x="378" y="192" width="22" height="22" rx="3" fill="#b193e8"/>
    <path d="M389 192 C381 180 372 178 372 168 C380 170 386 176 389 184 C392 176 398 170 406 168 C406 178 397 180 389 192 Z" fill="#8ed9b0"/>
    <!-- shelf shadow on the wall, offset right-down from the light -->
    <rect x="266" y="223" width="152" height="7" fill="#d9cdf2" opacity="0.55"/>
  </g>

  <!-- ===== framed picture, right wall ===== -->
  <g>
    <rect x="330" y="300" width="76" height="66" rx="5" fill="#c0abe6"/>
    <rect x="337" y="307" width="62" height="52" rx="3" fill="#f3edff"/>
    <!-- a paw mark, the app's own motif, drawn simply -->
    <g fill="#c9aef2">
      <ellipse cx="368" cy="338" rx="11" ry="9"/>
      <circle cx="356" cy="325" r="4"/><circle cx="365" cy="321" r="4"/>
      <circle cx="374" cy="321" r="4"/><circle cx="382" cy="326" r="4"/>
    </g>
    <rect x="334" y="366" width="76" height="6" fill="#d9cdf2" opacity="0.5"/>
  </g>

  <!-- ===== desk, left-of-centre ===== -->
  <g>
    <!-- contact shadow first, so the desk sits on the floor -->
    <ellipse cx="150" cy="676" rx="128" ry="14" fill="#b9a6dd" opacity="0.4"/>
    <!-- top -->
    <rect x="36" y="520" width="228" height="14" rx="4" fill="#c9b6ee"/>
    <rect x="36" y="520" width="228" height="3.5" fill="#f6f1ff" opacity="0.85"/>
    <!-- legs -->
    <rect x="46" y="534" width="13" height="142" fill="#bda9e6"/>
    <rect x="241" y="534" width="13" height="142" fill="#b39ede"/>
    <!-- drawer unit on the shaded side -->
    <rect x="176" y="534" width="78" height="142" fill="#c2aeea"/>
    <rect x="176" y="534" width="78" height="3" fill="#eee7ff" opacity="0.6"/>
    <g fill="#b096e0">
      <rect x="186" y="552" width="58" height="34" rx="3"/>
      <rect x="186" y="596" width="58" height="34" rx="3"/>
      <rect x="186" y="640" width="58" height="28" rx="3"/>
    </g>
    <g fill="#8f72cf">
      <rect x="206" y="566" width="18" height="4" rx="2"/>
      <rect x="206" y="610" width="18" height="4" rx="2"/>
      <rect x="206" y="650" width="18" height="4" rx="2"/>
    </g>

    <!-- monitor -->
    <rect x="74" y="404" width="126" height="92" rx="6" fill="#b7a2e4"/>
    <rect x="81" y="411" width="112" height="78" rx="4" fill="#dcecfb"/>
    <!-- three lines of "content", not a glowing screen -->
    <g fill="#b6d3ef">
      <rect x="90" y="422" width="62" height="6" rx="3"/>
      <rect x="90" y="436" width="86" height="6" rx="3"/>
      <rect x="90" y="450" width="44" height="6" rx="3"/>
    </g>
    <rect x="128" y="496" width="18" height="18" fill="#a992dd"/>
    <rect x="106" y="512" width="62" height="9" rx="4" fill="#a992dd"/>

    <!-- keyboard, drawn as a plate with a single row of keys -->
    <rect x="88" y="502" width="82" height="16" rx="4" fill="#cbbaf0" transform="rotate(-1.5 129 510)"/>
    <g fill="#b3a0e2" transform="rotate(-1.5 129 510)">
      <rect x="94" y="507" width="8" height="6" rx="1.5"/><rect x="105" y="507" width="8" height="6" rx="1.5"/>
      <rect x="116" y="507" width="8" height="6" rx="1.5"/><rect x="127" y="507" width="8" height="6" rx="1.5"/>
      <rect x="138" y="507" width="8" height="6" rx="1.5"/><rect x="149" y="507" width="8" height="6" rx="1.5"/>
    </g>

    <!-- mug, slightly off the keyboard's axis so the desk feels used -->
    <g>
      <rect x="214" y="494" width="26" height="26" rx="4" fill="#e8dcff"/>
      <path d="M240 500 h7 a7 7 0 0 1 0 14 h-7" fill="none" stroke="#e8dcff" stroke-width="4"/>
      <rect x="214" y="494" width="26" height="5" rx="2.5" fill="#cdb8f2"/>
    </g>
  </g>

  <!-- ===== chair, tucked in front of the desk ===== -->
  <g>
    <ellipse cx="300" cy="700" rx="58" ry="12" fill="#b9a6dd" opacity="0.35"/>
    <rect x="266" y="470" width="66" height="76" rx="10" fill="#bda9e6"/>
    <rect x="266" y="470" width="66" height="4" rx="2" fill="#efe8ff" opacity="0.65"/>
    <rect x="258" y="560" width="82" height="16" rx="6" fill="#c6b3ec"/>
    <rect x="258" y="560" width="82" height="4" rx="2" fill="#f3edff" opacity="0.7"/>
    <rect x="292" y="576" width="12" height="86" fill="#b096e0"/>
    <path d="M262 668 H336" stroke="#b096e0" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- ===== plant, right foreground ===== -->
  <g>
    <ellipse cx="392" cy="690" rx="40" ry="11" fill="#b9a6dd" opacity="0.4"/>
    <path d="M372 618 h44 l-6 66 h-32 Z" fill="#c9b0f0"/>
    <rect x="368" y="610" width="52" height="12" rx="4" fill="#d7c2f6"/>
    <rect x="368" y="610" width="52" height="3" fill="#f6f1ff" opacity="0.7"/>
    <g fill="#79c79c">
      <path d="M394 610 C378 592 366 586 358 566 C376 570 390 584 394 600 Z"/>
      <path d="M394 610 C410 592 422 586 430 566 C412 570 398 584 394 600 Z"/>
      <path d="M394 604 C392 578 396 560 402 540 C408 562 404 586 396 606 Z"/>
    </g>
    <g fill="#5fae83" opacity="0.55">
      <path d="M394 610 C386 596 378 590 370 578 C382 582 390 592 394 602 Z"/>
    </g>
  </g>

  <!-- ===== rug: the mascot stands here, so keep it simple and centred-right ===== -->
  <g>
    <ellipse cx="238" cy="782" rx="150" ry="46" fill="url(#rRug)"/>
    <ellipse cx="238" cy="782" rx="150" ry="46" fill="none" stroke="#bda3e8" stroke-width="3"/>
    <ellipse cx="238" cy="782" rx="112" ry="33" fill="none" stroke="#c9b3ee" stroke-width="2.5" opacity="0.8"/>
    <ellipse cx="238" cy="782" rx="74" ry="21" fill="none" stroke="#c9b3ee" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- ===== petals: four only, at different sizes, no symmetry ===== -->
  <g fill="#f6c9dd" opacity="0.75">
    <path d="M212 214 c7-6 15-3 14 5 c-1 7-10 11-15 6 c-3-3-2-8 1-11 Z"/>
    <path d="M330 452 c5-4 11-2 10 4 c-1 5-7 8-11 4 c-2-2-1-6 1-8 Z" opacity="0.6"/>
    <path d="M92 366 c6-5 13-2 12 4 c-1 6-9 9-13 5 c-2-3-1-7 1-9 Z" opacity="0.5"/>
    <path d="M404 528 c4-4 9-2 9 3 c-1 5-6 7-9 4 c-2-2-2-5 0-7 Z" opacity="0.45"/>
  </g>
</svg>
